---
name: "Build Containers"

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/postiz-app

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        env:
          CONTAINERVER: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "$IMAGE:${CONTAINERVER}" \
            -t "$IMAGE:latest" \
            --build-arg NEXT_PUBLIC_VERSION=${CONTAINERVER} \
            --pull \
            --provenance=false --sbom=false \
            --push .

      - name: Verify Image
        run: |
          docker buildx imagetools inspect "$IMAGE:latest"
